<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mastering Universal Unit Conversions</title>

<style>
:root {
  --primary: #2563eb;
  --primary-light: #eff6ff;
  --primary-border: #3b82f6;
  --success: #16a34a;
  --danger: #dc2626;
  --slate-700: #334155;
  --slate-800: #1e293b;
  --bg: #f8fafc;
  --card-bg: #ffffff;
}

body {
  margin: 0;
  padding: 40px 20px;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--slate-800);
  line-height: 1.6;
}

.card {
  max-width: 900px;
  margin: 0 auto;
  background: var(--card-bg);
  border-radius: 24px;
  padding: 40px;
  box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
  border: 1px solid #e2e8f0;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 8px;
  background: linear-gradient(90deg, var(--primary), #60a5fa);
}

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  font-size: 14px;
  font-weight: 700;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.q {
  font-size: 24px;
  font-weight: 700;
  line-height: 1.6;
  margin-bottom: 32px;
  background: var(--primary-light);
  padding: 24px;
  border-radius: 16px;
  border-left: 6px solid var(--primary-border);
  color: #1e3a8a;
}

.step-container {
  display: flex;
  flex-direction: column;
  gap: 24px;
  margin-bottom: 32px;
}

.step {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
}

.step-title {
  font-size: 18px;
  font-weight: 700;
  color: #1e40af;
  margin-top: 0;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.step-title::before {
  content: "→";
  color: var(--primary-border);
  font-weight: bold;
}

.formula-box {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #f1f5f9;
  padding: 16px 24px;
  border-radius: 12px;
  font-family: "Courier New", Courier, monospace;
  font-weight: 600;
  font-size: 18px;
  margin: 12px 0;
  overflow-x: auto;
  max-width: 100%;
}

.fraction {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  vertical-align: middle;
  padding: 0 10px;
  margin: 0 4px;
}

.fraction .num {
  border-bottom: 2px solid var(--slate-800);
  padding-bottom: 4px;
  text-align: center;
  width: 100%;
}

.fraction .den {
  padding-top: 4px;
  text-align: center;
  width: 100%;
}

.math-bracket-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: #f8fafc;
  padding: 24px;
  border-radius: 12px;
  border: 1px solid #cbd5e1;
  font-family: 'Courier New', monospace;
  font-size: 22px;
  margin: 16px 0;
  width: fit-content;
}

.mb-row { display: flex; }
.mb-left {
  width: 140px;
  text-align: right;
  padding-right: 12px;
  font-weight: bold;
  color: #64748b;
}
.mb-right { padding: 4px 12px; letter-spacing: 2px; }
.mb-quotient { color: var(--primary); font-weight: bold; }
.mb-dividend {
  border-top: 2px solid var(--slate-800);
  border-left: 2px solid var(--slate-800);
}

.click-prompt {
  background: #fffbeb;
  border: 2px dashed #f59e0b;
  color: #b45309;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
  margin-top: 20px;
}

.click-prompt:hover { background: #fef3c7; }

.btns {
  display: flex;
  gap: 16px;
  margin-top: 32px;
  border-top: 1px solid #e2e8f0;
  padding-top: 24px;
}

button {
  flex: 1;
  border: none;
  padding: 16px 28px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.1s, filter 0.2s;
}
button:active { transform: scale(0.98); }
.y { background: var(--success); color: white; }
.y:hover { filter: brightness(1.1); }
.n { background: #e2e8f0; color: var(--slate-700); }
.n:hover { background: #cbd5e1; }

.highlight { color: var(--primary-border); font-weight: 600; }
.final-ans-box {
  background: #f0fdf4;
  border: 2px solid #bbf7d0;
  padding: 24px;
  border-radius: 12px;
  color: #166534;
  font-size: 20px;
}
</style>
</head>

<body>

<main class="card">
  <div id="game"></div>
</main>

<script>
(function(){
"use strict";

const game = document.getElementById("game");
let questionNumber = 0;

// Exactly 42 units preserved and verified
const units = [
  ["quettametre", 1e30], ["ronnametre", 1e27], ["yottametre", 1e24], ["zettametre", 1e21],
  ["exametre", 1e18], ["petametre", 1e15], ["terametre", 1e12], ["gigametre", 1e9],
  ["megametre", 1e6], ["kilometre", 1e3], ["hectometre", 1e2], ["decametre", 1e1],
  ["metre", 1], ["decimetre", 1e-1], ["centimetre", 1e-2], ["millimetre", 1e-3],
  ["micrometre or micron", 1e-6], ["nanometre", 1e-9], ["angstrom", 1e-10], ["picometre", 1e-12],
  ["femtometre or fermi", 1e-15], ["attometre", 1e-18], ["zeptometre", 1e-21], ["yoctometre", 1e-24],
  ["rontometre", 1e-27], ["quectometre", 1e-30], ["astronomical unit (AU)", 1.495978707e11],
  ["light year", 9.460730472e15], ["parsec", 3.085677581e16], ["kiloparsec", 3.085677581e19],
  ["megaparsec", 3.085677581e22], ["gigaparsec", 3.085677581e25], ["inch", 2.54e-2],
  ["foot", 3.048e-1], ["yard", 9.144e-1], ["mile", 1.609344e3], ["nautical mile", 1.852e3],
  ["lunar distance", 3.84402e8], ["Earth radius", 6.371e6], ["solar radius", 6.957e8],
  ["Bohr radius", 5.291772109e-11], ["Planck length", 1.616255e-35]
];

let allPairs = [];

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pluralize(str){
  if(str.includes("radius")) return str.replace("radius","radii");
  if(str.includes("foot")) return str.replace("foot","feet");
  if(str.includes("inch")) return str.replace("inch","inches");
  if(str.includes("micron")) return str.replace("micron","microns");
  if(str.includes(" (")) return str.replace(" (","s (");
  return str + "s";
}

function scientificForm(num){
  if(num === 0) return {mantissa: 0, exponent: 0};
  const exponent = Math.floor(Math.log10(Math.abs(num)));
  const mantissa = num / Math.pow(10, exponent);
  return { mantissa, exponent };
}

function formatScientific(num){
  const sci = scientificForm(num);
  return `${sci.mantissa.toFixed(4).replace(/\.0000$/, '')} × 10<sup>${sci.exponent}</sup>`;
}

function generateLongDivision(num, den){
  let q = num / den;
  return `
  <div class="math-bracket-container">
    <div class="mb-row">
      <div class="mb-left"></div>
      <div class="mb-right mb-quotient">${q.toFixed(5)}...</div>
    </div>
    <div class="mb-row">
      <div class="mb-left">${den.toFixed(4).replace(/\.0000$/, '')}</div>
      <div class="mb-right mb-dividend">${num.toFixed(4).replace(/\.0000$/, '')}</div>
    </div>
  </div>
  `;
}

function initializePairs() {
  allPairs = [];
  units.forEach(u1 => {
    units.forEach(u2 => {
      if (u1 !== u2) allPairs.push([u1, u2]); 
    });
  });
  shuffle(allPairs);
}

function nextQuestion(){
  if(allPairs.length === 0) initializePairs();

  questionNumber++;
  game.innerHTML = "";

  const pair = allPairs.pop();
  const fromUnit = pair[0]; 
  const toUnit = pair[1];   

  const fromName = fromUnit[0], fromPlural = pluralize(fromName), fromValue = fromUnit[1];
  const toName = toUnit[0], toValue = toUnit[1];

  const actualAnswer = toValue / fromValue;

  const fromSci = scientificForm(fromValue);
  const toSci = scientificForm(toValue);

  const numMantissa = toSci.mantissa;
  const denMantissa = fromSci.mantissa;
  const initialExpDiff = toSci.exponent - fromSci.exponent;

  const rawMantissaRatio = numMantissa / denMantissa;
  const normalizationSci = scientificForm(rawMantissaRatio);
  
  const finalMantissa = normalizationSci.mantissa.toFixed(4).replace(/\.0000$/, '');
  const finalExponent = initialExpDiff + normalizationSci.exponent;

  // Build the state tracking frame
  const progressHeader = document.createElement("div");
  progressHeader.className = "progress-header";
  progressHeader.innerHTML = `<span>Dimensional Analysis Module</span><span>Problem #${questionNumber}</span>`;
  game.appendChild(progressHeader);

  const qDiv = document.createElement("div");
  qDiv.className = "q";
  qDiv.innerHTML = `How many <u>${fromPlural}</u> are present in exactly <b>1 ${toName}</b>?`;
  game.appendChild(qDiv);

  const clickPrompt = document.createElement("div");
  clickPrompt.className = "click-prompt";
  clickPrompt.innerHTML = "✨ Click here or press Space/Enter to reveal the step-by-step resolution";
  game.appendChild(clickPrompt);

  const stepsWrapper = document.createElement("div");
  stepsWrapper.className = "step-container";
  stepsWrapper.style.display = "none";
  game.appendChild(stepsWrapper);

  function revealSolution(){
    if(clickPrompt.style.display === "none") return;
    clickPrompt.style.display = "none";
    stepsWrapper.style.display = "flex";

    // Dynamic Step 5 text based on mathematical reality
    let shiftExplanation = "";
    if (normalizationSci.exponent === 0) {
        shiftExplanation = `Since <b>${rawMantissaRatio.toFixed(5)}</b> is already between 1 and 10, it is in valid standard form. 
        <br>No decimal shift is required, so the exponent remains unchanged.`;
    } else if (normalizationSci.exponent < 0) {
        shiftExplanation = `Because <b>${rawMantissaRatio.toFixed(5)}</b> is less than 1, we must move the decimal point <b>${Math.abs(normalizationSci.exponent)} place(s) to the right</b> to make it <b>${finalMantissa}</b>.
        <br><br>To balance making the mantissa larger, we must make the exponent smaller by subtracting ${Math.abs(normalizationSci.exponent)}.
        <br>The exponent changes from <b>${initialExpDiff}</b> to <b>${finalExponent}</b>.`;
    } else {
        shiftExplanation = `Because <b>${rawMantissaRatio.toFixed(5)}</b> is 10 or greater, we must move the decimal point <b>${normalizationSci.exponent} place(s) to the left</b> to make it <b>${finalMantissa}</b>.
        <br><br>To balance making the mantissa smaller, we must make the exponent larger by adding ${normalizationSci.exponent}.
        <br>The exponent changes from <b>${initialExpDiff}</b> to <b>${finalExponent}</b>.`;
    }

    stepsWrapper.innerHTML = `
      <div class="step">
        <h3 class="step-title">Step 1: Relate both units to the System International (Metres)</h3>
        1 ${toName} = <span class="highlight">${formatScientific(toValue)} m</span><br>
        1 ${fromName} = <span class="highlight">${formatScientific(fromValue)} m</span>
      </div>

      <div class="step">
        <h3 class="step-title">Step 2: Apply Dimensional Analysis (Unit Cancellation)</h3>
        To find the equivalent value, establish an identity fraction that cancels out the units we don't want:
        <br>
        <div class="formula-box">
          1 ${toName} × 
          <div class="fraction">
            <span class="num">${formatScientific(toValue)} m</span>
            <span class="den">1 ${toName}</span>
          </div>
          ×
          <div class="fraction">
            <span class="num">1 ${fromName}</span>
            <span class="den">${formatScientific(fromValue)} m</span>
          </div>
        </div>
        <br>
        Canceling out <i>${toName}</i> and <i>metres (m)</i> leaves us with our evaluation quotient expression:
        <br>
        <div class="formula-box">
          Quotient = 
          <div class="fraction">
            <span class="num">${numMantissa.toFixed(4).replace(/\.0000$/, '')} × 10<sup>${toSci.exponent}</sup></span>
            <span class="den">${denMantissa.toFixed(4).replace(/\.0000$/, '')} × 10<sup>${fromSci.exponent}</sup></span>
          </div>
        </div>
      </div>

      <div class="step">
        <h3 class="step-title">Step 3: Segregate Mantissas and Exponent Indices</h3>
        Using the Exponent Quotient Law: <div class="fraction" style="font-size:14px;"><span class="num">10<sup>A</sup></span><span class="den">10<sup>B</sup></span></div> = 10<sup>A - B</sup>
        <br><br>
        = ⚖️ <b>Mantissa Division:</b> <span class="highlight">(${numMantissa.toFixed(4).replace(/\.0000$/, '')} ÷ ${denMantissa.toFixed(4).replace(/\.0000$/, '')})</span><br>
        = ⚡ <b>Base 10 Exponent:</b> <span class="highlight">10<sup>${toSci.exponent} - (${fromSci.exponent})</sup></span> = 10<sup>${initialExpDiff}</sup>
      </div>

      <div class="step">
        <h3 class="step-title">Step 4: Execute Long Division on Core Mantissas</h3>
        ${generateLongDivision(numMantissa, denMantissa)}
        Intermediate value = <span class="highlight">${rawMantissaRatio.toFixed(5)}</span>
      </div>

      <div class="step">
        <h3 class="step-title">Step 5: Normalize into Standard Scientific Notation</h3>
        Our intermediate solution is: <b>${rawMantissaRatio.toFixed(5)} × 10<sup>${initialExpDiff}</sup></b>
        <br><br>
        Standard Scientific notation requires the mantissa (<i>M</i>) to satisfy: 1 &le; <i>M</i> &lt; 10.<br><br>
        ${shiftExplanation}
      </div>

      <div class="step final-ans-box">
        <h3 class="step-title" style="color:#15803d; border: none;">Final Verified Solution</h3>
        <b>1 ${toName} = ${finalMantissa} × 10<sup>${finalExponent}</sup> ${fromPlural}</b>
        <br><br>
        <span style="font-size:14px; color:#475569;">Exact System Unrounded Check: ${actualAnswer.toExponential(10)}</span>
      </div>
    `;
    showButtons();
  }

  clickPrompt.addEventListener("click", (e) => {
    e.stopPropagation();
    revealSolution();
  });

  const handleGlobalKeydown = (e) => {
    if(clickPrompt.style.display !== "none" && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault();
      revealSolution();
      window.removeEventListener("keydown", handleGlobalKeydown);
    }
  };
  window.addEventListener("keydown", handleGlobalKeydown);

  function showButtons(){
    const btns = document.createElement("div");
    btns.className = "btns";
    btns.innerHTML = `
      <button class="y">▶ Next Problem (Y)</button>
      <button class="n">⏹ Exit Program (N)</button>
    `;
    game.appendChild(btns);

    btns.querySelector(".y").onclick = (e)=>{
      e.stopPropagation();
      nextQuestion();
    };

    btns.querySelector(".n").onclick = (e)=>{
      e.stopPropagation();
      game.innerHTML = `
        <div class="q" style="background:#fef2f2; border-left:6px solid var(--danger); color:#991b1b;">
          Session Complete
        </div>
        <div class="step">Reload the page to restart the gameplay loop.</div>
      `;
    };
  }
}

document.addEventListener("keydown", function(e){
  const yBtn = document.querySelector(".btns .y");
  const nBtn = document.querySelector(".btns .n");
  if(yBtn && e.key.toLowerCase() === "y") { yBtn.click(); }
  if(nBtn && e.key.toLowerCase() === "n") { nBtn.click(); }
});

initializePairs();
nextQuestion();

})();
</script>

</body>
</html>
