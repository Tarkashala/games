<!doctype html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SI ↔ CGS Dimensional Conversion Master Game</title>

<style>
:root{
  --primary:#2563eb;
  --primary-light:#eff6ff;
  --success:#059669;
  --danger:#dc2626;
  --bg:#f1f5f9;
  --card:#ffffff;
  --accent:#7c3aed;
}
body{
  margin:0;
  padding:20px;
  font-family:"Segoe UI",system-ui,sans-serif;
  background:var(--bg);
  color:#1e293b;
}
.card{
  max-width:1100px;
  margin:0 auto;
  background:var(--card);
  border-radius:20px;
  padding:30px;
  box-shadow:0 15px 35px rgba(0,0,0,0.1);
  border-top:8px solid var(--primary);
}
.progress{
  display:flex;
  justify-content:space-between;
  font-weight:800;
  color:#64748b;
  margin-bottom:20px;
  font-size:13px;
  letter-spacing:1px;
}
.qbox{
  background:var(--primary-light);
  border-left:6px solid var(--primary);
  border-radius:15px;
  padding:30px;
  margin-bottom:30px;
}
.qtext{
  font-size:24px;
  font-weight:700;
  color:#1e3a8a;
  line-height:1.5;
}
.click{
  text-align:center;
  padding:40px;
  border:3px dashed #cbd5e1;
  border-radius:15px;
  cursor:pointer;
  color:#64748b;
  font-weight:700;
}
.step{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
}
.title{
  color:var(--accent);
  font-weight:800;
  margin-bottom:15px;
  font-size:18px;
}
.math{
  font-family:"Courier New",monospace;
  background:#f8fafc;
  border-radius:8px;
  padding:15px;
  overflow-x:auto;
  line-height:2;
}
.final{
  background:#ecfdf5;
  border:2px solid #10b981;
  border-radius:15px;
  padding:25px;
  margin-top:30px;
}
.btns{
  display:flex;
  gap:15px;
  margin-top:30px;
}
button{
  flex:1;
  border:none;
  border-radius:12px;
  padding:18px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}
.y{
  background:var(--success);
  color:white;
}
.n{
  background:#e2e8f0;
  color:#334155;
}
.long{
  background:#ffffff;
  border:1px solid #cbd5e1;
  border-radius:12px;
  padding:20px;
  margin-top:15px;
  font-family:"Courier New",monospace;
  overflow-x:auto;
}
.ld{
  line-height:2;
  white-space:pre;
  font-size:18px;
}
</style>
</head>

Conway's Constant, ~1.3035772690, Dimensionless
Gelfond's Constant, ~23.1406926327, Dimensionless
Magic Angle, ~0.9553166 (54.735 deg), rad (Dimensionless)
First Moment of Area, Variable, m^3
De Broglie Wavelength, Variable, m
Impact Parameter, Variable, m
Kerr Parameter (Specific Angular Momentum), Variable, m
Gravitational Wave Strain, Variable, Dimensionless
Radiant Exposure, Variable, J/m^2 (kg/s^2)
Catalan's Constant, ~0.915965594, Dimensionless
Plastic Ratio, ~1.324717957, Dimensionless
Khinchin's Constant, ~2.685452001, Dimensionless
Glaisher-Kinkelin Constant, ~1.282427129, Dimensionless
Sierpiński's Constant, ~2.584981759, Dimensionless
Astronomical Unit (AU), ~149597870700, m
Light-year (ly), ~9.4607304725808e15, m
Parsec (pc), ~3.08567758149137e16, m
Solar Mass (M_Sun), ~1.98847e30, kg
Solar Radius (R_Sun), ~6.957e8, m
Solar Luminosity (L_Sun), ~3.828e26, W (kg*m^2/s^3)
Earth Mass (M_Earth), ~5.9722e24, kg
Earth Equatorial Radius (R_Earth), ~6378137, m`;

// Parsing the master dimensional dataset
const db = csvData.trim().split('\n').slice(1).map(line => {
    let parts = line.split(',');
    let name = parts[0].trim();
    let valStr = parts[1].trim();
    let unit = parts.slice(2).join(',').trim();

    let p = {kg: 0, m: 0, s: 0};
    let base = unit;
    let match = unit.match(/\(([^)]+)\)/);
    if (match) {
        base = match[1];
    }

    let aliasMap = {
        'N': 'kg*m/s^2', 'J': 'kg*m^2/s^2', 'W': 'kg*m^2/s^3',
        'Pa': 'kg/(m*s^2)', 'Hz': 's^-1', 'Bq': 's^-1',
        'Gy': 'm^2/s^2', 'Sv': 'm^2/s^2'
    };
    if (aliasMap[base]) base = aliasMap[base];

    base = base.replace(/\s+/g, '');
    let numDen = base.split('/');
    let num = numDen[0];
    let den = numDen.length > 1 ? numDen[1].replace(/\(/g, '').replace(/\)/g, '') : '';

    function parse(s, sign) {
        if (!s) return;
        s.split('*').forEach(t => {
            let u = t.split('^')[0];
            let pow = t.split('^').length > 1 ? parseFloat(t.split('^')[1]) : 1;
            if (u === 'kg') p.kg += sign * pow;
            if (u === 'm') p.m += sign * pow;
            if (u === 's') p.s += sign * pow;
        });
    }

    parse(num, 1);
    parse(den, -1);

    // Derived properties
    let factorToCGS = Math.pow(1000, p.kg) * Math.pow(100, p.m); 
    
    let cgsUnit = unit
        .replace(/\bkg\b/g, 'g')
        .replace(/\bm\b/g, 'cm')
        .replace(/\bN\b/g, 'dyne')
        .replace(/\bJ\b/g, 'erg')
        .replace(/\bPa\b/g, 'Ba')
        .replace(/\bW\b/g, 'erg/s');

    return { name, valStr, unit, cgsUnit, p, factorToCGS };
});

let q = 0;

// Format helper to clean units dynamically via HTML superscript and nice dot operators
function formatUnit(unitStr) {
    if (!unitStr) return "";
    return unitStr.replace(/\^([-\d]+)/g, '<sup>$1</sup>').replace(/\*/g, '·');
}

function sci(n) {
    if (n === 0) return { m: 0, e: 0 };
    let e = Math.floor(Math.log10(Math.abs(n)));
    let m = n / Math.pow(10, e);
    if (Math.abs(m) >= 10) { m /= 10; e++; }
    if (Math.abs(m) < 1) { m *= 10; e--; }
    return { m, e };
}

function sciText(n) {
    if (n === 0) return `0`;
    const s = sci(n);
    return `${s.m.toFixed(4).replace(/\.?0+$/, "")} × 10<sup>${s.e}</sup>`;
}

// Emulate a division/multiplication graphical step matching the UI requirement
function longDivision(s1m, s2m, directionDiv) {
    let a = s1m;
    let b = s2m;
    let result = (a * b).toFixed(6);
    let operator = "×";
    if (directionDiv) {
        result = (a / b).toFixed(6);
        operator = "÷";
    }
    
    let html = `
    <div class="long">
    <div class="ld">
      ${a.toFixed(4)}
    ${operator} ${b.toFixed(4)}
    ------------
      ${result}
    </div>
    <br>
    <div><b>Mantissa Result = ${result}</b></div>
    </div>
    `;
    return html;
}

function rand(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function start() {
    q++;
    const game = document.getElementById("game");

    const item = rand(db);
    const convertToCGS = Math.random() < 0.5;

    let givenValue;
    if (item.valStr.includes('~')) {
        givenValue = parseFloat(item.valStr.replace(/[^0-9.eE+-]/g, ''));
    } else if (item.valStr.includes('(0 to 1)')) {
        givenValue = Math.random();
    } else if (item.valStr.includes('(>= 1)')) {
        givenValue = 1 + Math.random() * 99;
    } else if (item.valStr.includes('(-1.0 to 0.5)')) {
        givenValue = -1.0 + Math.random() * 1.5;
    } else {
        givenValue = Math.pow(10, (Math.random() * 6) - 3);
    }

    let givenUnitRaw = convertToCGS ? item.unit : item.cgsUnit;
    let targetUnitRaw = convertToCGS ? item.cgsUnit : item.unit;
    let factor = convertToCGS ? item.factorToCGS : (1 / item.factorToCGS);

    // Dimensionless handler
    if (factor === 1 && !item.p.kg && !item.p.m && !item.p.s) {
        targetUnitRaw = givenUnitRaw;
    }

    let givenUnitFormatted = formatUnit(givenUnitRaw);
    let targetUnitFormatted = formatUnit(targetUnitRaw);

    game.innerHTML = `
    <div class="progress">
    <div>DIMENSIONAL UNIT CONVERSION</div>
    <div>QUESTION ${q}</div>
    </div>

    <div class="qbox">
    <div class="qtext">
    The quantity <b>${item.name}</b> consists of base dimensional components: 
    <b>[M<sup>${item.p.kg}</sup> L<sup>${item.p.m}</sup> T<sup>${item.p.s}</sup>]</b>.
    <br><br>
    Convert
    <br><br>
    <b>${sciText(givenValue)} ${givenUnitFormatted}</b>
    <br><br>
    into <b>${targetUnitFormatted}</b>.
    </div>
    </div>

    <div class="click" id="reveal">
    ✨ Press any key or click here to reveal complete solution
    </div>

    <div id="sol" style="display:none"></div>
    `;

    function reveal() {
        document.removeEventListener("keydown", reveal);
        document.getElementById("reveal").style.display = "none";
        const sol = document.getElementById("sol");
        sol.style.display = "block";

        const ans = givenValue * factor;
        const s1 = sci(givenValue);
        const s2 = sci(factor);
        const s3 = sci(ans);
        
        let logicHtml = "Dimensionless ratio. SI and CGS representations are identical.";
        
        if (factor !== 1 || item.p.kg !== 0 || item.p.m !== 0) {
            let fromPow = convertToCGS ? {kg: 1000, m: 100, s: 1} : {kg: 1/1000, m: 1/100, s: 1};
            let fromU = convertToCGS ? {kg: 'g', m: 'cm', s: 's'} : {kg: 'kg', m: 'm', s: 's'};
            
            let parts = [];
            if (item.p.kg) parts.push(`(${fromPow.kg} ${fromU.kg})<sup>${item.p.kg}</sup>`);
            if (item.p.m) parts.push(`(${fromPow.m} ${fromU.m})<sup>${item.p.m}</sup>`);
            if (item.p.s) parts.push(`(1 ${fromU.s})<sup>${item.p.s}</sup>`);
            
            logicHtml = `1 ${givenUnitFormatted}<br> = ${parts.join(' × ')} <br> = ${sciText(factor)} ${targetUnitFormatted}`;
        }

        sol.innerHTML = `
        <div class="step">
        <div class="title">Step 1: Dimensional Replacement Logic</div>
        <div class="math">
        ${logicHtml}
        </div>
        </div>

        <div class="step">
        <div class="title">Step 2: Substitute the given quantity</div>
        <div class="math">
        ${sciText(givenValue)} ${givenUnitFormatted}
        <br><br>
        = (${s1.m.toFixed(4)} × 10<sup>${s1.e}</sup>) × (${s2.m.toFixed(4)} × 10<sup>${s2.e}</sup>)
        </div>
        </div>

        <div class="step">
        <div class="title">Step 3: Process Mantissas</div>
        <div class="math">
        ${s1.m.toFixed(4)} × ${s2.m.toFixed(4)}
        <br><br>
        = ${(s1.m * s2.m).toFixed(6)}
        </div>
        ${longDivision(s1.m, s2.m, !convertToCGS && factor !== 1)}
        </div>

        <div class="step">
        <div class="title">Step 4: Process Powers of 10</div>
        <div class="math">
        10<sup>${s1.e}</sup> × 10<sup>${s2.e}</sup>
        <br><br>
        = 10<sup>${s1.e + s2.e}</sup>
        </div>
        </div>

        <div class="step">
        <div class="title">Step 5: Normalize Scientific Notation</div>
        <div class="math">
        
        <br><br>
        ${(s1.m * s2.m).toFixed(6)} × 10<sup>${s1.e + s2.e}</sup>
        <br><br>
        Final normalized scientific notation:
        <br><br>
        ${s3.m.toFixed(4)} × 10<sup>${s3.e}</sup>
        </div>
        </div>

        <div class="final">
        <div class="title" style="color:#059669">Final Answer</div>
        <div style="font-size:24px;font-weight:800;">
        ${s3.m.toFixed(4)} × 10<sup>${s3.e}</sup> ${targetUnitFormatted}
        </div>
        </div>

        <div class="btns">
        <button class="y" id="y">Y = Next Question</button>
        <button class="n" id="n">N = Exit</button>
        </div>
        `;

        document.getElementById("y").onclick = start;
        document.getElementById("n").onclick = () => {
            game.innerHTML = `
            <div class="qbox" style="background:#fef2f2;border-left:6px solid #dc2626;">
            <div class="qtext" style="color:#991b1b;">Session Ended</div>
            </div>
            <div class="step">Refresh the page to restart the game.</div>
            `;
        };
    }

    document.addEventListener("keydown", reveal, {once: true});
    document.getElementById("reveal").onclick = reveal;
}

start();

})();
</script>
