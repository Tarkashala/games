<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metres to Units Conversion Game</title>

<style>
body {
  margin: 0;
  padding: 40px 20px;
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f4f6f9;
  color: #222;
}

.card {
  max-width: 1100px;
  margin: 0 auto;
  background: white;
  border-radius: 16px;
  padding: 40px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  border-top: 6px solid #2563eb;
}

.q {
  font-size: 25px;
  font-weight: 700;
  line-height: 1.8;
  margin-bottom: 28px;
  background: #eff6ff;
  padding: 20px;
  border-radius: 10px;
  border-left: 6px solid #3b82f6;
}

.step {
  margin: 18px 0;
  padding-left: 14px;
  border-left: 4px solid #dbeafe;
  line-height: 1.9;
  font-size: 18px;
}

.step-title {
  font-size: 20px;
  color: #1e40af;
  margin-bottom: 8px;
  display: inline-block;
}

.highlight-box {
  background: #f8fafc;
  padding: 15px;
  border-radius: 8px;
  border: 1px solid #e2e8f0;
  margin-top: 10px;
}

.math-bracket-container {
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  background: #ffffff; 
  padding: 30px 20px; 
  border-radius: 12px; 
  border: 1px solid #cbd5e1; 
  font-family: 'Courier New', Courier, monospace; 
  font-size: 26px;
  margin: 15px 0;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
}

.mb-row {
  display: flex;
}

.mb-left {
  width: 120px;
  text-align: right;
  padding-right: 15px;
  font-weight: bold;
}

.mb-right {
  padding: 5px 15px;
  letter-spacing: 5px;
}

.mb-quotient {
  color: #2563eb;
  font-weight: bold;
  border-bottom: 2px solid transparent;
}

.mb-dividend {
  border-top: 2px solid #0f172a;
  border-left: 2px solid #0f172a;
  border-top-left-radius: 6px;
}

.gd-steps-container {
  width: 100%;
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.gd-step {
  background: #f1f5f9;
  padding: 12px 18px;
  border-radius: 8px;
  font-family: "Segoe UI", Arial, sans-serif;
  font-size: 17px;
  border-left: 4px solid #38bdf8;
}

.gd-badge {
  background: #0f172a;
  color: white;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: bold;
  margin-right: 10px;
  text-transform: uppercase;
}

.gd-subtext {
  display: block;
  margin-top: 6px;
  margin-left: 75px;
  color: #475569;
  font-size: 15px;
}

.btns {
  display: flex;
  gap: 18px;
  margin-top: 30px;
}

button {
  border: none;
  padding: 14px 34px;
  border-radius: 10px;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.y {
  background: #15803d;
  color: white;
}

.n {
  background: #dc2626;
  color: white;
}
</style>
</head>

<body>

<main class="card">
<div id="game"></div>
</main>

<script>
(function(){
"use strict";

const game = document.getElementById("game");
let questionNumber = 0;

const units = [
  ["quettametre", 1e30],
  ["ronnametre", 1e27],
  ["yottametre", 1e24],
  ["zettametre", 1e21],
  ["exametre", 1e18],
  ["petametre", 1e15],
  ["terametre", 1e12],
  ["gigametre", 1e9],
  ["megametre", 1e6],
  ["kilometre", 1e3],
  ["hectometre", 1e2],
  ["decametre", 1e1],
  ["metre", 1],
  ["decimetre", 1e-1],
  ["centimetre", 1e-2],
  ["millimetre", 1e-3],
  ["micrometre or micron", 1e-6],
  ["nanometre", 1e-9],
  ["angstrom", 1e-10],
  ["picometre", 1e-12],
  ["femtometre or fermi", 1e-15],
  ["attometre", 1e-18],
  ["zeptometre", 1e-21],
  ["yoctometre", 1e-24],
  ["rontometre", 1e-27],
  ["quectometre", 1e-30],
  ["astronomical unit (AU)", 1.495978707e11],
  ["light year", 9.460730472e15],
  ["parsec", 3.085677581e16],
  ["kiloparsec", 3.085677581e19],
  ["megaparsec", 3.085677581e22],
  ["gigaparsec", 3.085677581e25],
  ["inch", 2.54e-2],
  ["foot", 3.048e-1],
  ["yard", 9.144e-1],
  ["mile", 1.609344e3],
  ["nautical mile", 1.852e3],
  ["lunar distance", 3.84402e8],
  ["Earth radius", 6.371e6],
  ["solar radius", 6.957e8],
  ["Bohr radius", 5.291772109e-11],
  ["Planck length", 1.616255e-35]
];

function shuffle(arr){
  for(let i=arr.length-1; i>0; i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

let remaining = shuffle([...units]);

function pluralize(str) {
    if(str.includes("radius")) return str.replace("radius", "radii");
    if(str.includes("foot")) return str.replace("foot", "feet");
    if(str.includes("inch")) return str.replace("inch", "inches");
    if(str.includes("micron")) return str.replace("micron", "microns");
    if(str.includes(" (")) return str.replace(" (", "s (");
    return str + "s";
}

function formatValue(val) {
    let str = val.toString();
    if(str.includes('e')) {
        let parts = str.split('e');
        let m = parts[0];
        let e = parseInt(parts[1], 10);
        return `${m} &times; 10<sup>${e}</sup>`;
    }
    return str;
}

function scientificForm(num){
  if(num===0) return {mantissa:0, exponent:0};
  const exponent = Math.floor(Math.log10(Math.abs(num)));
  const mantissa = num / Math.pow(10, exponent);
  return { mantissa: mantissa, exponent: exponent };
}

function generateGraphicalLongDivision(num, den) {
    if (den === 1) {
        return `<div class="highlight-box" style="text-align:center; font-size:20px;"><b>${num} ÷ 1 = ${num}</b></div>`;
    }

    let q = num / den;
    let qStr = q.toFixed(5);
    let divStr = den.toString();
    let numStr = num.toString() + ".00000";

    let html = `
    <div class="math-bracket-container">
      <div class="mb-row">
        <div class="mb-left"></div>
        <div class="mb-right mb-quotient">${qStr}</div>
      </div>
      <div class="mb-row">
        <div class="mb-left">${divStr}</div>
        <div class="mb-right mb-dividend">${numStr}</div>
      </div>
    </div>
    <div class="gd-steps-container">`;
    
    let cur = num;
    html += `
      <div class="gd-step">
        <span class="gd-badge">Start</span> ${cur} ÷ ${den} = <b>0</b> 
        <span style="color:#64748b; margin-left:10px;">(Remainder ${cur})</span>
      </div>`;
      
    cur *= 10;
    
    for(let i=1; i<=5; i++) {
        let digit = Math.floor(cur / den);
        // Fix: Use integer subtraction instead of modulo to avoid floating point artifacts
        let rem = cur - (digit * den);
        
        html += `
        <div class="gd-step">
          <span class="gd-badge">Step ${i}</span> Bring down 0 ➔ ${cur} ÷ ${den} = <b style="color:#2563eb; font-size:19px;">${digit}</b>
          <span class="gd-subtext">Subtract: ${cur} - (${digit} &times; ${den}) = ${cur - (digit * den)} = <b>${rem}</b> (New Remainder)</span>
        </div>`;
        cur = rem * 10;
    }
    
    html += `</div>`;
    return html;
}

function nextQuestion(){
  if(remaining.length===0){
    remaining = shuffle([...units]);
  }

  questionNumber++;
  game.innerHTML = "";

  const item = remaining.pop();
  const unit = item[0];
  const unitPlural = pluralize(unit);
  const metres = item[1];
  
  const formattedMetres = formatValue(metres);
  const sci = scientificForm(metres);

  const qDiv = document.createElement("div");
  qDiv.className = "q";
  qDiv.innerHTML = `Q${questionNumber}. We know that 1 ${unit} = ${formattedMetres} metres.<br>Using mathematical inversion, <b>how many ${unitPlural} are present in exactly 1 metre?</b>`;
  game.appendChild(qDiv);

  const reveal = document.createElement("div");
  reveal.className = "step";
  reveal.innerHTML = `<b>Press Enter, Spacebar, or Tap anywhere to reveal the step-by-step mathematical solution.</b>`;
  game.appendChild(reveal);

  function revealSolution(e){
    if(e && e.type==="keydown" && e.key!=="Enter" && e.key!==" "){
      return;
    }

    document.removeEventListener("keydown", revealSolution);
    document.removeEventListener("click", revealSolution);

    // Pedagogical Calculations
    let approxMantissa = parseFloat(sci.mantissa.toPrecision(4)); 
    let mantissaStr = approxMantissa.toString();
    let decimalPlaces = mantissaStr.includes('.') ? mantissaStr.split('.')[1].length : 0;
    let multiplier = Math.pow(10, decimalPlaces);
    
    let newNum = 1 * multiplier; 
    let newDen = Math.round(approxMantissa * multiplier); 
    let newExp = -sci.exponent; 
    
    let divisionResult = newNum / newDen;
    
    // Generate dynamic explanations
    let step3Text = "";
    let step4Text = "";

    if (approxMantissa === 1) {
        step3Text = `The number in the denominator is 1, so the fraction is already as simple as possible.`;
        step4Text = `We do not need to add any zeros because there are no decimals to remove!`;
    } else {
        step3Text = `If the divisor is a long decimal, we can approximate it to <b>4 significant digits</b> to make calculation easier:<br><br>
        Divisor &approx; <b>${approxMantissa}</b><br><br>
        Our fraction becomes: <b>(1 / ${approxMantissa}) &times; 10<sup>${newExp}</sup></b>`;
        
        if (decimalPlaces > 0) {
            step4Text = `Since ${approxMantissa} has ${decimalPlaces} decimal place(s), we multiply the numerator and the denominator by ${formatValue(multiplier)} (adding ${decimalPlaces} zeros to the 1). This turns the divisor into a nice whole number fraction without changing its overall value!<br><br>
            <div class="highlight-box">
            <b>Numerator:</b> 1 &times; ${multiplier} = <b>${newNum}</b><br>
            <b>Denominator:</b> ${approxMantissa} &times; ${multiplier} = <b>${newDen}</b><br><br>
            <b>Equivalent Fraction:</b> (${newNum} / ${newDen}) &times; 10<sup>${newExp}</sup>
            </div>`;
        } else {
            step4Text = `The divisor (${approxMantissa}) is already a whole number, so we don't need to add any zeros to remove a decimal.<br><br>
            Equivalent Fraction: <b>(${newNum} / ${newDen}) &times; 10<sup>${newExp}</sup></b>`;
        }
    }

    // Standard Form Logic based on pedagogical calculation
    let divSci = scientificForm(divisionResult);
    let shift = divSci.exponent; 
    let finalExp = newExp + shift;
    let finalMantissa = divSci.mantissa.toFixed(4);
    
    let step6Text = `Combining our new quotient and the exponent, we currently have: <b>${divisionResult.toFixed(5)} &times; 10<sup>${newExp}</sup></b>.<br><br>`;
    
    if (shift === 0) {
        step6Text += `To write a number in proper scientific form, there must be exactly one non-zero digit before the decimal point.<br><br>
        The quotient <b>${divisionResult.toFixed(5)}</b> already fits this rule beautifully. No exponent adjustment is needed!`;
    } else if (shift < 0) {
        let places = Math.abs(shift);
        step6Text += `To write a number in proper scientific form, there must be <b>exactly one non-zero digit before the decimal point</b>.<br><br>
        We must move the decimal <b>${places} place(s) to the right</b> to get <b>${finalMantissa}</b>. <br><br>
        Because we made the decimal part larger by a factor of 10<sup>${places}</sup>, we must balance the scale by <i>borrowing</i> ${places} tens from our exponent.<br><br>
        <div class="highlight-box" style="text-align:center;">
          New Exponent: ${newExp} - ${places} = <b>${finalExp}</b><br><br>
          Adjusted Result: <b>${finalMantissa} &times; 10<sup>${finalExp}</sup></b>
        </div>`;
    } else {
        let places = shift;
        step6Text += `To write a number in proper scientific form, there must be <b>exactly one non-zero digit before the decimal point</b>.<br><br>
        We must move the decimal <b>${places} place(s) to the left</b> to get <b>${finalMantissa}</b>. <br><br>
        Because we made the decimal part smaller by dividing by 10<sup>${places}</sup>, we must balance the scale by <i>giving</i> ${places} tens back to our exponent.<br><br>
        <div class="highlight-box" style="text-align:center;">
          New Exponent: ${newExp} + ${places} = <b>${finalExp}</b><br><br>
          Adjusted Result: <b>${finalMantissa} &times; 10<sup>${finalExp}</sup></b>
        </div>`;
    }

    reveal.innerHTML = `
    <div class="step">
      <b class="step-title">Step 1: Set up the Inverse Fraction</b><br>
      To find how many ${unitPlural} fit into a metre, we divide 1 by the size of the unit in scientific notation.<br><br>
      1 metre = <b>1 / (${sci.mantissa} &times; 10<sup>${sci.exponent}</sup>)</b> ${unitPlural}
    </div>

    <div class="step">
      <b class="step-title">Step 2: Move Power of 10 to the Numerator</b><br>
      When we move a power of ten from the denominator to the numerator, <b>we flip the sign of the exponent</b>. This makes the math much cleaner to work with.<br><br>
      Fraction: <b>(1 / ${sci.mantissa}) &times; 10<sup>${newExp}</sup></b>
    </div>

    <div class="step">
      <b class="step-title">Step 3: Approximate the Divisor</b><br>
      ${step3Text}
    </div>

    <div class="step">
      <b class="step-title">Step 4: Create a Clean Fraction (Add Zeros)</b><br>
      ${step4Text}
    </div>

    <div class="step">
      <b class="step-title">Step 5: Graphical Long Division</b><br>
      Now, let's divide the new numerator by the new denominator (${newNum} ÷ ${newDen}):
      ${generateGraphicalLongDivision(newNum, newDen)}
    </div>

    <div class="step">
      <b class="step-title">Step 6: Convert to Standard Scientific Form</b><br>
      ${step6Text}
    </div>

    <div class="step" style="margin-top: 30px;">
      <div style="background:#e0e7ff; padding: 25px; border-radius: 12px; border-left: 6px solid #1e40af; font-size: 22px;">
        <b style="color:#1e40af;">Final Answer:</b><br><br>
        1 metre &approx; <b>${finalMantissa} &times; 10<sup>${finalExp}</sup></b> ${unitPlural}
      </div>
    </div>
    `;

    showButtons();
  }

  document.addEventListener("keydown", revealSolution);
  document.addEventListener("click", revealSolution);

  function showButtons(){
    const btns = document.createElement("div");
    btns.className = "btns";
    btns.innerHTML = `
    <button class="y">Y = Next Question</button>
    <button class="n">N = Exit</button>
    `;
    game.appendChild(btns);

    btns.querySelector(".y").onclick = (e)=>{
      e.stopPropagation();
      nextQuestion();
    };

    btns.querySelector(".n").onclick = (e)=>{
      e.stopPropagation();
      game.innerHTML = `
      <div class="q" style="background:#fee2e2;border-left:6px solid #dc2626;">
      Session Ended
      </div>
      <div class="step">
      Refresh the page to restart the game.
      </div>
      `;
    };
  }
}

document.addEventListener("keydown", function(e){
  const yBtn = document.querySelector(".btns .y");
  const nBtn = document.querySelector(".btns .n");

  if(yBtn && e.key.toLowerCase()==="y"){
    yBtn.click();
  }
  if(nBtn && e.key.toLowerCase()==="n"){
    nBtn.click();
  }
});

nextQuestion();

})();
</script>

</body>
</html>
