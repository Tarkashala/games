            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.12);
            position: relative;
            min-height: 680px;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Page Layouts */
        .page {
            display: none;
            padding: 40px;
            flex: 1;
            flex-direction: column;
            animation: fadeIn 0.4s ease-out;
            overflow-y: auto;
        }
        .page.active {
            display: flex;
        }

        /* Custom Scrollbar */
        .page::-webkit-scrollbar { width: 8px; }
        .page::-webkit-scrollbar-track { background: #f1f2f6; border-radius: 4px; }
        .page::-webkit-scrollbar-thumb { background: #b2bec3; border-radius: 4px; }
        .page::-webkit-scrollbar-thumb:hover { background: #636e72; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Question Screen */
        .question-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .question-text {
            font-size: 25px;
            line-height: 1.6;
            text-align: center;
            margin-bottom: 45px;
            font-weight: 500;
        }
        
        .highlight-q { color: var(--energy-q); font-weight: bold; background: #fdf2e9; padding: 2px 8px; border-radius: 6px; border: 1px solid #fadbd8; }
        .highlight-w { color: var(--work-w); font-weight: bold; background: #ebf5fb; padding: 2px 8px; border-radius: 6px; border: 1px solid #d4e6f1; }
        .highlight-u { color: var(--delta-u); font-weight: bold; background: #f5eef8; padding: 2px 8px; border-radius: 6px; border: 1px solid #e8daef; }

        .interaction-prompt {
            text-align: center;
            font-size: 19px;
            color: var(--text-muted);
            animation: pulse 2s infinite;
            cursor: pointer;
            padding: 20px;
            border: 2px dashed var(--border-light);
            border-radius: 12px;
            background: #fafbfc;
            user-select: none;
            width: 85%;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* Answer Screen */
        .answer-header {
            text-align: center;
            font-size: 26px;
            margin-bottom: 25px;
            font-weight: bold;
            color: var(--text-main);
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 15px;
        }

        .step-box {
            background: var(--math-bg);
            border-left: 5px solid var(--border-light);
            padding: 16px 22px;
            margin-bottom: 16px;
            border-radius: 0 8px 8px 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .step-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .step-content {
            font-size: 16.5px;
            line-height: 1.55;
            color: #34495e;
        }

        .math-block {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 12px;
            margin-top: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 19px;
            text-align: center;
            border-radius: 6px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
        }
        
        .vertical-math {
            display: block;
            white-space: pre;
            font-family: 'Courier New', Courier, monospace;
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 18px;
            line-height: 1.3;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            text-align: left;
        }

        .border-q { border-left-color: var(--energy-q); }
        .border-w { border-left-color: var(--work-w); }
        .border-u { border-left-color: var(--delta-u); }
        .border-info { border-left-color: #3498db; }
        
        .conclusion {
            background: #eaafc8;
            background: -webkit-linear-gradient(to right, #f1eef6, #eef2f7);
            background: #edf7ed;
            border: 2px solid var(--success);
            text-align: center;
            padding: 22px;
            font-size: 19px;
            font-weight: bold;
            color: #1e4620;
            border-radius: 12px;
            margin-top: 25px;
            line-height: 1.5;
        }

            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #f1f2f6;
        }

            border: none;

            font-size: 19px;
            font-weight: bold;
            color: white;
            border-radius: 8px;

        /* Exit Page */
        .exit-message {
            text-align: center;
            font-size: 34px;
            color: var(--delta-u);
            font-weight: bold;
            line-height: 1.5;
        }
    </style>

            { sys: "globular cluster core gas cloud", q_pos: "gains thermal energy from dynamic stellar stellar encounter shocks worth", q_neg: "loses heat energy radiating millimetric interstellar wave spectrums worth", w_pos: "is compressed by the combined gravitational core collapse attraction doing work of", w_neg: "does mechanical expansion work blowing outward from central stellar winds worth", dU_pos: "takes on a net internal energy gain of", dU_neg: "takes on a net internal energy deficit of" },
            { sys: "cosmic string surrounding plasma matrix", q_pos: "absorbs exotic high-energy radiation from topological decays worth", q_neg: "loses energy via ultra-high frequency neutrino cooling paths worth", w_pos: "is compressed by spacetime metric conical tension lines doing work of", w_neg: "performs relativistic expansion work driving out ambient cosmic gas worth", dU_pos: "registers an internal energy change of positive", dU_neg: "registers an internal energy change of negative" },
            { sys: "solar core radiative zone cell", q_pos: "absorbs thermal energy from internal hydrogen nuclear fusion chambers worth", q_neg: "loses heat via photon diffusion out to convective cell layers worth", w_pos: "is compressed by thousands of miles of overlying stellar weight columns doing work of", w_neg: "performs work expanding outwards against gravitational settling lines worth", dU_pos: "secures a net internal energy addition of", dU_neg: "secures a net internal energy reduction of" },

            // Biological & Microfluidic Systems (131-150)
            { sys: "mitochondrial membrane chamber", q_pos: "absorbs chemical energy from electron transport chain cascades worth", q_neg: "loses heat via thermal dissipation into cellular cytoplasm worth", w_pos: "is compressed compressed via high osmotic proton gradient forces doing work of", w_neg: "performs mechanical work driving rotating ATP synthase rotor units worth", dU_pos: "experiences an internal energy climb of", dU_neg: "experiences an internal energy decline of" },
            { sys: "plant chloroplast stroma matrix", q_pos: "gains energy from captured solar light harvesting complexes worth", q_neg: "loses heat via non-photochemical fluorescence quenching loops worth", w_pos: "is compressed by osmotic turgor pressure changes in the leaf doing work of", w_neg: "does structural work expanding thylakoid membrane layers open worth", dU_pos: "yields a net internal energy addition of", dU_neg: "yields a net internal energy subtraction of" },
            { sys: "cardiac muscle cell sarcomere", q_pos: "absorbs energy from calcium-activated ATP hydrolysis tracks worth", q_neg: "loses heat conducted to circulating capillary blood flow lines worth", w_pos: "is compressed stretched by blood filling the heart chamber doing work of", w_neg: "performs mechanical work contracting and pumping blood to aorta tracks worth", dU_pos: "accumulates an internal energy expansion of", dU_neg: "accumulates an internal energy thinning of" },
            { sys: "microfluidic cell-sorting channel", q_pos: "gains heat from high frequency dielectrophoretic sorting fields worth", q_neg: "loses heat conducted to glass micro-chip backing plates worth", w_pos: "is compressed by high pressure carrier syringe fluid pumps doing work of", w_neg: "does work expanding out channel droplet shapes to redirect cell tracks worth", dU_pos: "registers an internal energy surge of", dU_neg: "registers an internal energy drop of" },
            { sys: "deep-sea hyperthermophile cell", q_pos: "absorbs thermal energy from boiling volcanic vent mineral streams worth", q_neg: "loses heat to ambient deep trench benthic ocean flows worth", w_pos: "is compressed by extreme thousands-of-meters water columns doing work of", w_neg: "does mechanical work expanding cell walls to divide and replicate worth", dU_pos: "shows a total internal energy increase of", dU_neg: "shows a total internal energy decrease of" },
            { sys: "synthetic protocell lipid bilayer", q_pos: "absorbs energy from hydrophobic micelle fusion processes worth", q_neg: "loses heat via thermal dissipation into bulk water buffers worth", w_pos: "is compressed by external micro-pipette suction clamp walls doing work of", w_neg: "performs mechanical work expanding its surface layout to grow pseudopods worth", dU_pos: "captures an internal energy addition of", dU_neg: "captures an internal energy loss of" },
            { sys: "bacterial flagellar motor switch", q_pos: "gains heat from transmembrane electrochemical ion fluxes worth", q_neg: "loses heat energy via atomic friction to water surroundings worth", w_pos: "is compressed by local flagellar filament torque back-stresses doing work of", w_neg: "performs work spinning flagellar hooks to propel cells forward worth", dU_pos: "logs an internal energy rise of", dU_neg: "logs an internal energy drop of" },
            { sys: "artificial lung oxygenation matrix", q_pos: "absorbs thermal energy from warm blood stream inflows worth", q_neg: "loses heat conduction to external metallic frame fixtures worth", w_pos: "is compressed by mechanical air ventilation bellows compression doing work of", w_neg: "performs work expanding capillary grid paths filtering out carbon dioxide worth", dU_pos: "manifests an internal energy growth of", dU_neg: "manifests an internal energy retreat of" },
            { sys: "electric eel electrocyte cell pack", q_pos: "absorbs biochemical energy from acetylcholine vesicle releases worth", q_neg: "loses heat via passive water cooling thermal conduction fields worth", w_pos: "is compressed by external tail muscle compression swimming forces doing work of", w_neg: "does active work generating external high-voltage electric currents worth", dU_pos: "secures an internal energy rise of", dU_neg: "secures an internal energy fall of" },
            { sys: "bioluminescent firefly lantern cell", q_pos: "absorbs chemical energy from luciferin oxidation pathways worth", q_neg: "loses energy emitting visible cool green photon wave pulses worth", w_pos: "is compressed by abdominal breathing air pump tube cycles doing work of", w_neg: "performs micro-mechanical work adjusting internal light organ crystal scales worth", dU_pos: "develops an internal energy expansion of", dU_neg: "develops an internal energy compression of" }
        ];

        // State Machine
        let currentState = 'question';
        let currentItem = null;
        let unknownVar = ''; // 'dU', 'q', 'w'
        let q_true = 0, w_true = 0, dU_true = 0;
        let q_unit = '', w_unit = '', dU_unit = 'kJ';
        let q_present = 0, w_present = 0, dU_present = 0;
        let bothJoules = false;

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function getRandomFloat(min, max) {
            return parseFloat((Math.random() * (max - min) + min).toFixed(2));
        }

        function initGame() {
            loadQuestion();
            document.addEventListener('keydown', handleGlobalKeydown);
            document.getElementById('interaction-prompt').addEventListener('click', triggerSolution);
            document.getElementById('btn-yes').addEventListener('click', loadQuestion);
            document.getElementById('btn-no').addEventListener('click', exitGame);
        }

        function loadQuestion() {
            currentState = 'question';
            document.getElementById('question-page').classList.add('active');
            document.getElementById('answer-page').classList.remove('active');
            document.getElementById('exit-page').classList.remove('active');

            // Pick a unique scenario out of the 150 items
            currentItem = systemsPool[Math.floor(Math.random() * systemsPool.length)];

            // Choose signs randomly (+1 or -1) to systematically cover all 4 math quadrants
            let qSign = Math.random() > 0.5 ? 1 : -1;
            let wSign = Math.random() > 0.5 ? 1 : -1;

            // Generate values in kJ (consistent math)
            let absQ = getRandomFloat(5.0, 95.0);
            let absW = getRandomFloat(5.0, 95.0);

            q_true = qSign * absQ;
            w_true = wSign * absW;
            dU_true = q_true + w_true;

            // Round values to match float expectations
            q_true = parseFloat(q_true.toFixed(2));
            w_true = parseFloat(w_true.toFixed(2));
            dU_true = parseFloat(dU_true.toFixed(2));

            // Select unknown type at random (1 out of 3 choices)
            let unknownRand = getRandomInt(0, 2);
            if (unknownRand === 0) unknownVar = 'dU';
            else if (unknownRand === 1) unknownVar = 'q';
            else unknownVar = 'w';

            // Determine if both presentation units are Joules
            bothJoules = Math.random() > 0.65;

            // Assign presentation formatting strings
            if (bothJoules) {
                q_unit = 'J'; w_unit = 'J'; dU_unit = 'J';
                q_present = Math.round(q_true * 1000);
                w_present = Math.round(w_true * 1000);
                dU_present = Math.round(dU_true * 1000);
            } else {
                // Randomly mix units if not both Joules
                let q_mix = Math.random() > 0.5;
                let w_mix = Math.random() > 0.5;
                let dU_mix = Math.random() > 0.5;

                q_unit = q_mix ? 'J' : 'kJ';
                q_present = q_mix ? Math.round(q_true * 1000) : q_true;

                w_unit = w_mix ? 'J' : 'kJ';
                w_present = w_mix ? Math.round(w_true * 1000) : w_true;

                dU_unit = dU_mix ? 'J' : 'kJ';
                dU_present = dU_mix ? Math.round(dU_true * 1000) : dU_true;
            }

            // Construct localized text narrative dynamically
            let sentence = `In an engineering experiment, a <b>${currentItem.sys}</b> `;
            let partsText = [];

            if (unknownVar !== 'q') {
                let textQ = q_true > 0 ? currentItem.q_pos : currentItem.q_neg;
                partsText.push(`${textQ} <span class="highlight-q">${Math.abs(q_present)} ${q_unit}</span>`);
            }
            if (unknownVar !== 'w') {
                let textW = w_true > 0 ? currentItem.w_pos : currentItem.w_neg;
                partsText.push(`${textW} <span class="highlight-w">${Math.abs(w_present)} ${w_unit}</span>`);
            }
            if (unknownVar !== 'dU') {
                let textDU = dU_true > 0 ? currentItem.dU_pos : currentItem.dU_neg;
                partsText.push(`${textDU} <span class="highlight-u">${Math.abs(dU_present)} ${dU_unit}</span>`);
            }

            // Join text pieces smoothly
            sentence += partsText[0] + " and " + partsText[1] + ".";

            // State explicit calculation challenge target
            let targetString = '';
            if (unknownVar === 'dU') {
                targetString = `Calculate the total <b>change in internal energy (&Delta;U)</b> in kilojoules (kJ).`;
            } else if (unknownVar === 'q') {
                targetString = `Calculate the net <b>heat/energy change (q)</b> in kilojoules (kJ) and specify if it is absorbed or released.`;
            } else {
                targetString = `Calculate the net <b>work done (w)</b> in kilojoules (kJ) and state if work was performed on or by the system.`;
            }

            document.getElementById('question-text').innerHTML = `${sentence}<br><br>${targetString}`;
        }

        function handleGlobalKeydown(e) {
            if (currentState === 'question') {
                triggerSolution();
            } else if (currentState === 'answer') {
                if (e.key.toLowerCase() === 'y') loadQuestion();
                if (e.key.toLowerCase() === 'n') exitGame();
            }
        }

        function triggerSolution() {
            if (currentState !== 'question') return;
            currentState = 'answer';
            document.getElementById('question-page').classList.remove('active');
            document.getElementById('answer-page').classList.add('active');
            
            generateStepsCode();
            document.getElementById('answer-page').scrollTop = 0;
        }

        function makeStepHTML(title, content, borderClass) {
            return `
                <div class="step-box ${borderClass}">
                    <div class="step-title">${title}</div>
                    <div class="step-content">${content}</div>
                </div>
            `;
        }

        // Generates clean padded layout blocks for paper-like vertical decimal operations
        function createVerticalVisualizer(v1, v2, op, total) {
            let s1 = Math.abs(v1).toFixed(2);
            let s2 = Math.abs(v2).toFixed(2);
            let sR = Math.abs(total).toFixed(2);
            
            let maxLen = Math.max(s1.length, s2.length, sR.length);
            s1 = s1.padStart(maxLen, ' ');
            s2 = s2.padStart(maxLen, ' ');
            sR = sR.padStart(maxLen, ' ');
            
            let dividerLine = '-'.repeat(maxLen + 4);
            let signPrefix = total < 0 ? '-' : '+';
            
            return `
                <div class="vertical-math">
   ${s1}
 ${op} ${s2}
 ${dividerLine}
 ${signPrefix} ${sR}
                </div>
            `;
        }

        function generateStepsCode() {
            let container = document.getElementById('steps-container');
            let html = '';
            let currentStep = 1;

            // Step 1: Parsing variables from text tokens
            html += `<div class="step-box border-info">
                <div class="step-title">Step ${currentStep++}: Extract Values and Signs from Context</div>
                <div class="step-content">
                    Thermodynamic variables must follow precise directional sign rules:
                    <ul>`;

            if (unknownVar !== 'dU') {
                let reason = dU_true > 0 ? "energy increased (+)" : "energy decreased (-)";
                html += `<li><b>&Delta;U (Internal Energy Change):</b> Presented as ${Math.abs(dU_present)} ${dU_unit}. Since the text states the system '${dU_true > 0 ? currentItem.dU_pos : currentItem.dU_neg}', it acts mathematically as <b>${dU_true > 0 ? '+' : '-'}${Math.abs(dU_present)} ${dU_unit}</b> (${reason}).</li>`;
            } else {
                html += `<li><b>&Delta;U (Internal Energy Change):</b> This is our <b>UNKNOWN</b> variable to isolate and solve.</li>`;
            }

            if (unknownVar !== 'q') {
                let reason = q_true > 0 ? "energy absorbed/gained (+)" : "energy released/lost (-)";
                html += `<li><b>q (Heat/Energy Absorbed):</b> Presented as ${Math.abs(q_present)} ${q_unit}. Since the text states the system '${q_true > 0 ? currentItem.q_pos : currentItem.q_neg}', it acts mathematically as <b>${q_true > 0 ? '+' : '-'}${Math.abs(q_present)} ${q_unit}</b> (${reason}).</li>`;
            } else {
                html += `<li><b>q (Heat/Energy Transferred):</b> This is our <b>UNKNOWN</b> variable to isolate and solve.</li>`;
            }

            if (unknownVar !== 'w') {
                let reason = w_true > 0 ? "work done ON the system (+)" : "work done BY the system (-)";
                html += `<li><b>w (Work Done):</b> Presented as ${Math.abs(w_present)} ${w_unit}. Since the text states the system '${w_true > 0 ? currentItem.w_pos : currentItem.w_neg}', it acts mathematically as <b>${w_true > 0 ? '+' : '-'}${Math.abs(w_present)} ${w_unit}</b> (${reason}).</li>`;
            } else {
                html += `<li><b>w (Work Done):</b> This is our <b>UNKNOWN</b> variable to isolate and solve.</li>`;
            }

            html += `</ul></div></div>`;

            // Setup working math tracking values
            let calcDU = bothJoules ? Math.round(dU_true * 1000) : dU_true;
            let calcQ = bothJoules ? Math.round(q_true * 1000) : q_true;
            let calcW = bothJoules ? Math.round(w_true * 1000) : w_true;
            let currentUnit = bothJoules ? 'J' : 'kJ';

            // Step 2: Harmonize units if they are mixed
            if (!bothJoules && (q_unit === 'J' || w_unit === 'J' || dU_unit === 'J')) {
                html += `<div class="step-box border-info">
                    <div class="step-title">Step ${currentStep++}: Standardize Mixed Units to kilojoules (kJ)</div>
                    <div class="step-content">
                        Since some variables are given in Joules (J), we convert them to kilojoules (kJ) by dividing by 1000 to maintain uniformity:
                        <ul>`;
                
                if (unknownVar !== 'q' && q_unit === 'J') {
                    let signedStr = q_true < 0 ? '-' : '+';
                    html += `<li>Convert q: (${signedStr}${Math.abs(q_present)} J) &divide; 1000 = <b>${q_true} kJ</b></li>`;
                }
                if (unknownVar !== 'w' && w_unit === 'J') {
                    let signedStr = w_true < 0 ? '-' : '+';
                    html += `<li>Convert w: (${signedStr}${Math.abs(w_present)} J) &divide; 1000 = <b>${w_true} kJ</b></li>`;
                }
                if (unknownVar !== 'dU' && dU_unit === 'J') {
                    let signedStr = dU_true < 0 ? '-' : '+';
                    html += `<li>Convert &Delta;U: (${signedStr}${Math.abs(dU_present)} J) &divide; 1000 = <b>${dU_true} kJ</b></li>`;
                }
                html += `</ul>We will calculate the rest of the expression entirely using <b>kJ</b> units.</div></div>`;
                calcDU = dU_true; calcQ = q_true; calcW = w_true;
            } else if (bothJoules) {
                html += `<div class="step-box border-info">
                    <div class="step-title">Step ${currentStep++}: Standardize Units Check</div>
                    <div class="step-content">Both given values are in Joules (J). We will execute the entire linear equation algebra using <b>Joules (J)</b> first, and convert the final result to kilojoules (kJ) at the very end.</div></div>`;
            }

            // Step 3: Write out First Law Template
            html += `<div class="step-box border-u">
                <div class="step-title">Step ${currentStep++}: Reference the First Law of Thermodynamics Formula</div>
                <div class="step-content">
                    The fundamental law states that the net change in internal energy is equal to final energy minus initial energy, which is the sum of energy absorbed and work done on the system:
                    <div class="math-block">&Delta;U = U<sub>2</sub> - U<sub>1</sub> = q + w</div>
                </div>
            </div>`;

            // Step 4: Substitute parameters inside brackets
            let dU_str = unknownVar === 'dU' ? '&Delta;U' : `(${calcDU < 0 ? '' : '+'}${calcDU})`;
            let q_str = unknownVar === 'q' ? 'q' : `(${calcQ < 0 ? '' : '+'}${calcQ})`;
            let w_str = unknownVar === 'w' ? 'w' : `(${calcW < 0 ? '' : '+'}${calcW})`;

            html += `<div class="step-box border-u">
                <div class="step-title">Step ${currentStep++}: Substitute Known Values inside Brackets</div>
                <div class="step-content">
                    Placing our signed numerical parameters cleanly into the equation formula:
                    <div class="math-block">${dU_str} = ${q_str} + ${w_str}</div>
                </div>
            </div>`;

            // Step 5: Algebraic isolation and linear rule handling
            if (unknownVar === 'dU') {
                let opSign = calcW < 0 ? '-' : '+';
                let signRuleText = calcW < 0 ? `"+(-)" = "-" (Plus of a minus number simplifies directly into subtraction)` : `"+(+)" = "+" (Plus of a plus number remains standard addition)`;
                
                html += `<div class="step-box border-info">
                    <div class="step-title">Step ${currentStep++}: Simplify Operator Signs</div>
                    <div class="step-content">
                        Simplify the trailing bracket connection rule: ${signRuleText}.
                        <div class="math-block">&Delta;U = ${calcQ} ${opSign} ${Math.abs(calcW)}</div>
                    </div>
                </div>`;
            } 
            else if (unknownVar === 'q') {
                let opSign = calcW < 0 ? '-' : '+';
                html += `<div class="step-box border-info">
                    <div class="step-title">Step ${currentStep++}: Simplify Right-Side Sign Bracket</div>
                    <div class="step-content">
                        First, combine signs on the right side. ${calcW < 0 ? '"+(-)" becomes "-"' : '"+(+)" becomes "+"'} :
                        <div class="math-block">${calcDU} = q ${opSign} ${Math.abs(calcW)}</div>
                    </div>
                </div>`;

                let inverseSign = calcW < 0 ? '+' : '-';
                let transText = calcW < 0 ? `To isolate 'q', move the negative value to the other side of the equals sign, changing its sign to addition (+)` : `To isolate 'q', move the positive value to the other side of the equals sign, changing its sign to subtraction (-)`;
                
                html += `<div class="step-box border-info">
                    <div class="step-title">Step ${currentStep++}: Isolate the Unknown Variable (q)</div>
                    <div class="step-content">
                        ${transText}:
                        <div class="math-block">q = ${calcDU} ${inverseSign} (${Math.abs(calcW)})</div>
                    </div>
                </div>`;
            } 
            else if (unknownVar === 'w') {
                html += `<div class="step-box border-info">
                    <div class="step-title">Step ${currentStep++}: Isolate the Unknown Variable (w)</div>
                    <div class="step-content">
                        To isolate 'w', transpose the heat term to the other side of the equals sign. Moving it causes its sign to flip:
                        <div class="math-block">w = ${calcDU} - (${calcQ})</div>
                    </div>
                </div>`;

                let signCombinationRule = calcQ < 0 ? `"-(-)" = "+"` : `"-(+)" = "-"`;
                let explSign = calcQ < 0 ? "Minus of a minus becomes a plus!" : "Minus of a plus becomes subtraction.";
                let finalOp = calcQ < 0 ? '+' : '-';

                html += `<div class="step-box border-info">
                    <div class="step-title">Step ${currentStep++}: Process Operator Double Signs</div>
                    <div class="step-content">
                        Apply integer subtraction rule: ${signCombinationRule} (${explSign}):
                        <div class="math-block">w = ${calcDU} ${finalOp} ${Math.abs(calcQ)}</div>
                    </div>
                </div>`;
            }

            // Step 6: Decimal execution breakdown
            let targetAns = unknownVar === 'dU' ? calcDU : (unknownVar === 'q' ? calcQ : calcW);
            let n1 = 0, n2 = 0, finalOpChar = '+';
            
            if (unknownVar === 'dU') { n1 = calcQ; n2 = Math.abs(calcW); finalOpChar = calcW < 0 ? '-' : '+'; } 
            else if (unknownVar === 'q') { n1 = calcDU; n2 = Math.abs(calcW); finalOpChar = calcW < 0 ? '+' : '-'; } 
            else { n1 = calcDU; n2 = Math.abs(calcQ); finalOpChar = calcQ < 0 ? '+' : '-'; }

            html += `<div class="step-box border-u">
                <div class="step-title">Step ${currentStep++}: Align Decimals and Calculate</div>
                <div class="step-content">
                    Let's compute the arithmetic carefully. Align the columns vertically relative to the decimal point:
                    ${createVerticalVisualizer(n1, n2, finalOpChar, targetAns)}
                    <br>
                    This results in: <b>${targetAns} ${currentUnit}</b>
                </div>
            </div>`;

            // Step 7: Conversion to kJ if it was Joules
            if (bothJoules) {
                let finalKj = parseFloat((targetAns / 1000).toFixed(5));
                html += `<div class="step-box border-info">
                    <div class="step-title">Step ${currentStep++}: Convert Final Value to Required kilojoules (kJ)</div>
                    <div class="step-content">
                        Since our entire problem was calculated in Joules, we convert the final value into kilojoules by dividing by 1000:<br>
                        <div class="math-block">${targetAns} J &divide; 1000 = <b>${finalKj} kJ</b></div>
                    </div>
                </div>`;
            }

            // Step 8: Dynamic physical interpretation conclusion
            let trueFinalVal = unknownVar === 'dU' ? dU_true : (unknownVar === 'q' ? q_true : w_true);
            let finalInterpretationText = '';

            if (unknownVar === 'dU') {
                finalInterpretationText = trueFinalVal > 0 ? 
                    `The overall internal energy of the ${currentItem.sys} has <b>gained/increased</b> by ${Math.abs(trueFinalVal)} kJ.` : 
                    `The overall internal energy of the ${currentItem.sys} has <b>lost/decreased</b> by ${Math.abs(trueFinalVal)} kJ.`;
            } else if (unknownVar === 'q') {
                finalInterpretationText = trueFinalVal > 0 ? 
                    `Since q is positive (+), energy was net <b>absorbed/gained</b> by the ${currentItem.sys} from its surrounding environment.` : 
                    `Since q is negative (-), energy was net <b>released/lost</b> by the ${currentItem.sys} out into the surroundings.`;
            } else {
                finalInterpretationText = trueFinalVal > 0 ? 
                    `Since w is positive (+), mechanical work was net <b>performed ON</b> the ${currentItem.sys} by external forces.` : 
                    `Since w is negative (-), mechanical work was net <b>performed BY</b> the ${currentItem.sys} pushing against its surroundings.`;
            }

            html += `<div class="conclusion">
                🎯 Final Operational Summary:<br><br>
                The calculated parameter value is <b>${trueFinalVal} kJ</b>.<br>
                ${finalInterpretationText}
            </div>`;

            container.innerHTML = html;
        }

        function exitGame() {
            currentState = 'exit';
            document.getElementById('question-page').classList.remove('active');
            document.getElementById('answer-page').classList.remove('active');
            document.getElementById('exit-page').classList.add('active');
            document.removeEventListener('keydown', handleGlobalKeydown);
        }

        window.onload = initGame;
    </script>
</body>
</html>
